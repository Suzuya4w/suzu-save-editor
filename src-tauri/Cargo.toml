[package]
name = "suzu-save-editor"
version = "1.0.0"
description = "Ultimate Save Game Manager & Editor"
authors = ["Suzuya4w"]
edition = "2024"
default-run = "suzu-save-editor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "suzu_save_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4.44"
tokio = { version = "1.52.3", features = ["fs", "io-util", "rt-multi-thread", "net", "sync", "macros", "time"] }
axum = "0.7.5"
tower-http = { version = "0.5.2", features = ["cors"] }
lz-str = "0.2.1"
base64 = "0.22.1"
serde-pickle = "1.2.0"
flate2 = "1.1.9"
tauri-plugin-dialog = "2.7.1"
marshal-rs = { path = "../../marshal-rs-patched" }
regex = "1.12.3"
tauri-plugin-fs = "2"
hexf-parse = "0.2.1"
byteorder = "1.5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5.0"
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize", "send"] }
nom = "7.1.3"
encoding_rs = "0.8.34"
urlencoding = "2.1.3"
hex = "0.4.3"
flash-lso = { version = "0.5.0", features = ["serde"] }
quick-xml = { version = "0.40.1", features = ["serialize"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls"] }
zip = "8.6.0"
dashmap = "6.2.1"
uuid = { version = "1.23.3", features = ["v4"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
async-stream = "0.3.6"
futures-util = "0.3.32"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2"
async-trait = "0.1.89"
extism = "1.30.0"
ahash = "0.8.12"
rustls = { version = "0.23", features = ["ring"] }
fastnbt = "2.6.1"
crc = "3.4.0"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
local-ip-address = "0.6.13"
lazy_static = "1.5.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[profile.dev]
split-debuginfo = "unpacked"
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
winreg = "0.52.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
