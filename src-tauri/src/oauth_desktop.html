<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suzu Save Editor - Authentication</title>
    <style>
        body {
            background-color: #0a0a0a;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 24px 24px;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .content-box {
            position: relative;
            padding: 40px;
            box-shadow: 8px 8px 0px #000;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s ease-out forwards;
        }
        .content-box::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: radial-gradient(
                250px circle at var(--x, 50%) var(--y, 50%), 
                #FF7A00 0%, 
                #1a1a1a 100%
            );
            z-index: -2;
            transition: opacity 0.3s ease;
        }
        .content-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background-color: #0a0a0a;
            z-index: -1;
        }
        h1 {
            color: #FF7A00;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            animation: pulseGlow 2s infinite alternate;
        }
        p {
            color: #a1a1aa;
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUp 0.5s ease-out forwards;
        }
        p:nth-of-type(1) { animation-delay: 0.2s; }
        p:nth-of-type(2) { animation-delay: 0.4s; }
        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            from { text-shadow: 0 0 0px rgba(255,122,0,0); }
            to { text-shadow: 0 0 12px rgba(255,122,0,0.6); }
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="content-box">
        <h1 id="status-title">Authenticating...</h1>
        <p id="status-desc">Processing your secure token<span class="loading-dots" id="dots"></span></p>
        <p id="status-info">Please do not close this window.</p>
    </div>

    <script>
        const box = document.querySelector('.content-box');
        let isHovering = false;
        let autoAngle = 0;

        box.addEventListener('mouseenter', () => { isHovering = true; });
        box.addEventListener('mousemove', (e) => {
            if (isHovering) {
                const rect = box.getBoundingClientRect();
                box.style.setProperty('--x', `${e.clientX - rect.left}px`);
                box.style.setProperty('--y', `${e.clientY - rect.top}px`);
            }
        });
        box.addEventListener('mouseleave', () => { isHovering = false; });

        function animateIdleGlow() {
            if (!isHovering) {
                autoAngle += 0.03;
                box.style.setProperty('--x', `${50 + Math.sin(autoAngle) * 50}%`);
                box.style.setProperty('--y', `${50 + Math.cos(autoAngle) * 50}%`);
            }
            requestAnimationFrame(animateIdleGlow);
        }
        animateIdleGlow();

        if (window.location.hash) {
            fetch('http://127.0.0.1:14225/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hash: window.location.hash })
            }).then(() => {
                document.getElementById('status-title').innerText = 'Authentication Successful';
                document.getElementById('status-desc').innerText = 'You may now return to the app.';
                document.getElementById('dots').classList.remove('loading-dots');
                document.getElementById('status-info').innerText = 'This tab will close automatically...';
                setTimeout(() => window.close(), 1500);
            }).catch(e => {
                document.getElementById('status-title').innerText = 'Authentication Failed';
                document.getElementById('status-title').style.color = '#ef4444';
                document.getElementById('status-desc').innerText = 'Error communicating with the local app.';
                document.getElementById('dots').classList.remove('loading-dots');
                document.getElementById('status-info').innerText = '';
            });
        } else {
            document.getElementById('status-title').innerText = 'Authentication Error';
            document.getElementById('status-title').style.color = '#ef4444';
            document.getElementById('status-desc').innerText = 'No access token found in URL.';
            document.getElementById('dots').classList.remove('loading-dots');
            document.getElementById('status-info').innerText = '';
        }
    </script>
</body>
</html>
